---
stages:
  build:
    buildTool: "mta"
    buildDescriptor: "mta.yaml"
    buildToolVersion: "MBTJ21N24"
    npmLint:
      failOnError: false
  malwareScan:
    scan: false
    _additional: {}
  additionalTests:
    runFirst:
      command: |
        set -u

        echo "=== QUALITY GATE: LINT ==="
        lint_failed=0
        for pkg in $(find . -name package.json -not -path "*/node_modules/*" -not -path "./gen/*" | sort); do
          dir="$(dirname "$pkg")"
          echo "[LINT] $dir"
          if cd "$dir" && npm run ci-lint; then
            echo "[PASS] LINT $dir"
          else
            echo "[FAIL] LINT $dir"
            lint_failed=1
          fi
          cd - >/dev/null
        done

        echo "=== QUALITY GATE: AUDIT (HIGH/CRITICAL BLOCKING) ==="
        audit_failed=0
        for pkg in $(find . -name package.json -not -path "*/node_modules/*" -not -path "./gen/*" | sort); do
          dir="$(dirname "$pkg")"
          echo "[AUDIT] $dir"
          if cd "$dir" && npm run ci-audit; then
            echo "[PASS] AUDIT $dir"
          else
            echo "[FAIL] AUDIT $dir"
            audit_failed=1
          fi
          cd - >/dev/null
        done

        echo "=== QUALITY GATE SUMMARY ==="
        echo "LINT_FAILED=$lint_failed"
        echo "AUDIT_FAILED=$audit_failed"

        if [ "$lint_failed" -ne 0 ] || [ "$audit_failed" -ne 0 ]; then
          echo "QUALITY GATE FAILED"
          exit 1
        fi

        echo "QUALITY GATE PASSED"
