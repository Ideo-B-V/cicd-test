_schema-version: 3.3.0
ID: cicd-test
version: 1.0.0
description: "A simple CAP project."
parameters:
  enable-parallel-deployments: true
  deploy_mode: html5-repo
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
modules:
  - name: cicd-test-srv
    type: nodejs
    path: gen/srv
    parameters:
      instances: 1
      buildpack: nodejs_buildpack
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api # required by consumers of CAP services (e.g. approuter)
        properties:
          srv-url: ${default-url}
    requires:
      - name: cicd-test-destination

  - name: cicd-test-app-deployer
    type: com.sap.application.content
    path: gen
    build-parameters:
      build-result: app/
      requires:
        - name: cicdtestadminauthors
          artifacts:
            - admin-authors.zip
          target-path: app/
        - name: cicdtestadminbooks
          artifacts:
            - admin-books.zip
          target-path: app/
        - name: cicdtestbrowse
          artifacts:
            - browse.zip
          target-path: app/
        - name: cicdtestgenres
          artifacts:
            - genres.zip
          target-path: app/
    requires:
      - name: srv-api
      - name: cicd-test-html5-repo-host
        parameters:
          content-target: true
          config:
            HTML5Runtime_enabled: true
    parameters:
      config:
        destinations:
          - Name: srv-api
            URL: ~{srv-api/srv-url}
            Authentication: NoAuthentication
            Type: HTTP
            ProxyType: Internet
            ForwardAuthToken: true
            DynamicDestination: true

  - name: cicdtestadminauthors
    type: html5
    path: app/admin-authors
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm ci
        - npm run build
      supported-platforms:
        []
  - name: cicdtestadminbooks
    type: html5
    path: app/admin-books
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm ci
        - npm run build
      supported-platforms:
        []
  - name: cicdtestbrowse
    type: html5
    path: app/browse
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm ci
        - npm run build
      supported-platforms:
        []
  - name: cicdtestgenres
    type: html5
    path: app/genres
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm ci
        - npm run build
      supported-platforms:
        []

  - name: cicd-test-destinations
    type: com.sap.application.content
    requires:
      - name: cicd-test-html5-repo-host
        parameters:
          service-key:
            name: cicd-test-html5-repo-host-key
      - name: srv-api
      - name: cicd-test-destination
        parameters:
          content-target: true
    build-parameters:
      no-source: true
    parameters:
      content:
        instance:
          existing_destinations_policy: update
          destinations:
            - Name: cicd-test-html5-repository
              ServiceInstanceName: cicd-test-html5-repo-host
              ServiceKeyName: cicd-test-html5-repo-host-key
              sap.cloud.service: cicdtest.service

resources:
  - name: cicd-test-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
    requires:
      - name: srv-api

  - name: cicd-test-html5-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host
